name: EE04 Spectra 6 firmware
on:
  push:
    branches:
      - master
    paths:
      - 'firmware/lumairie-ee04/**'
      - 'apps/mobile/lib/services/**'
      - 'apps/mobile/test/frame_wifi_transport_test.dart'
      - 'apps/mobile/lib/main.dart'
      - '.github/workflows/ee04-display-smoke.yml'
      - 'docs/RELEASE_EE04_PREVIEW.md'
      - 'tools/ee04-windows-preview/**'
  pull_request:
    paths:
      - 'firmware/lumairie-ee04/**'
      - 'apps/mobile/lib/services/pairing.dart'
      - '.github/workflows/ee04-display-smoke.yml'
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache Seeed toolchains and libraries
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-ee04-seeed-1.1.1-${{ runner.os }}-v1
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Run static compatibility checks
        run: python -m unittest discover -s firmware/lumairie-ee04/tests -p 'test_*.py' -v
      - name: Build integrated EE04 firmware
        working-directory: firmware/lumairie-ee04/device
        run: pio run -e ee04
      - name: Decode on-device ESP32-S3 reboot-loop backtrace
        working-directory: firmware/lumairie-ee04/device
        shell: bash
        run: |
          set -euo pipefail
          ELF=.pio/build/ee04/firmware.elf
          test -s "$ELF"
          find ~/.platformio/packages -type f -name '*addr2line' | head -15
          ADDR2LINE="$(find ~/.platformio/packages -type f \( -name 'xtensa-esp32s3-elf-addr2line' -o -name 'xtensa-esp-elf-addr2line' \) | head -1)"
          test -x "$ADDR2LINE"
          echo "==== SHA256: compiled app vs uploaded test build ===="
          sha256sum .pio/build/ee04/firmware.bin
          echo "==== Symbolized physical crash (from 2026-11-11 serial log) ===="
          "$ADDR2LINE" -a -f -C -i -e "$ELF" \
            0x403873fd 0x403873fa 0x40386d39 0x40386e9c \
            0x4037688f 0x403768a9 0x40376459 \
            0x4204dc4b 0x4206e94a 0x42069681 0x4204e223 \
            0x4206102b 0x42056d39 0x420533fe 0x4205292b \
            0x42004383 0x420046c2 0x420037e9 0x42013842 0x40382365
      - name: Upload compiled ELF for physical crash diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: lumairie-ee04-elf-for-crash-analysis
          path: firmware/lumairie-ee04/device/.pio/build/ee04/firmware.elf
          if-no-files-found: error
      - name: Upload integrated USB flash binary
        uses: actions/upload-artifact@v4
        with:
          name: lumairie-ee04-integrated-firmware
          path: firmware/lumairie-ee04/device/.pio/build/ee04/firmware.bin
          if-no-files-found: error
      - name: Upload complete USB flash image set
        uses: actions/upload-artifact@v4
        with:
          name: lumairie-ee04-flash-images
          path: firmware/lumairie-ee04/device/.pio/build/ee04/*.bin
          if-no-files-found: error
      - name: Compile separate screen diagnostic
        working-directory: firmware/lumairie-ee04/display-smoke
        run: pio run -e ee04_spectra6

  flutter-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch existing app dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Analyze modified app source
        working-directory: apps/mobile
        run: flutter analyze --no-pub lib
      - name: Existing pairing tests
        working-directory: apps/mobile
        run: flutter test test/pairing_test.dart test/frame_wifi_transport_test.dart
      - name: Build Android hardware-test APK
        working-directory: apps/mobile
        run: flutter build apk --release
      - name: Upload Android hardware-test APK
        uses: actions/upload-artifact@v4
        with:
          name: lumairie-photo-transfer-android-test-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  publish-preview:
    # Publish only after successful app and firmware builds on master.
    # Never publish artifacts produced by untrusted pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [firmware, flutter-protocol]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.2.0-ee04-preview.2
    steps:
      - uses: actions/checkout@v4
      - name: Fetch tested Android APK from this CI run
        uses: actions/download-artifact@v4
        with:
          name: lumairie-photo-transfer-android-test-apk
          path: release/android
      - name: Fetch tested bootloader, partitions, and app from this CI run
        uses: actions/download-artifact@v4
        with:
          name: lumairie-ee04-flash-images
          path: release/flash
      - name: Validate Windows uploader Python source
        run: python -m py_compile tools/ee04-windows-preview/LUMAIRIE_Installer.py
      - name: Assemble preview and SHA256 integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          test -s release/android/app-release.apk
          test -s release/flash/bootloader.bin
          test -s release/flash/partitions.bin
          test -s release/flash/firmware.bin
          mkdir -p release/out
          cp release/android/app-release.apk release/out/LUMAIRIE-Android-EE04-PREVIEW.apk
          cp release/flash/firmware.bin release/out/LUMAIRIE-EE04-ESP32S3-firmware.bin
          cp release/flash/bootloader.bin release/out/LUMAIRIE-EE04-ESP32S3-bootloader.bin
          cp release/flash/partitions.bin release/out/LUMAIRIE-EE04-ESP32S3-partitions.bin
          cp docs/RELEASE_EE04_PREVIEW.md release/flash/READ_ME_FIRST.md
          cp tools/ee04-windows-preview/LUMAIRIE_Installer.py release/flash/LUMAIRIE_Installer.py
          cp tools/ee04-windows-preview/START_LUMAIRIE_WINDOWS.bat release/flash/START_LUMAIRIE_WINDOWS.bat
          (
            cd release/flash
            sha256sum bootloader.bin partitions.bin firmware.bin > SHA256-FLASH-FILES.txt
            zip -9 -q ../out/LUMAIRIE-EE04-ESP32S3-FLASH-IMAGES.zip \
              bootloader.bin partitions.bin firmware.bin READ_ME_FIRST.md SHA256-FLASH-FILES.txt LUMAIRIE_Installer.py START_LUMAIRIE_WINDOWS.bat
          )
          (
            cd release/out
            sha256sum LUMAIRIE-Android-EE04-PREVIEW.apk \
              LUMAIRIE-EE04-ESP32S3-firmware.bin \
              LUMAIRIE-EE04-ESP32S3-bootloader.bin \
              LUMAIRIE-EE04-ESP32S3-partitions.bin \
              LUMAIRIE-EE04-ESP32S3-FLASH-IMAGES.zip > SHA256SUMS.txt
          )
      - name: Publish GitHub prerelease, not a production release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              release/out/LUMAIRIE-Android-EE04-PREVIEW.apk \
              release/out/LUMAIRIE-EE04-ESP32S3-firmware.bin \
              release/out/LUMAIRIE-EE04-ESP32S3-bootloader.bin \
              release/out/LUMAIRIE-EE04-ESP32S3-partitions.bin \
              release/out/LUMAIRIE-EE04-ESP32S3-FLASH-IMAGES.zip \
              release/out/SHA256SUMS.txt \
              --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --prerelease \
              --notes-file docs/RELEASE_EE04_PREVIEW.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              release/out/LUMAIRIE-Android-EE04-PREVIEW.apk \
              release/out/LUMAIRIE-EE04-ESP32S3-firmware.bin \
              release/out/LUMAIRIE-EE04-ESP32S3-bootloader.bin \
              release/out/LUMAIRIE-EE04-ESP32S3-partitions.bin \
              release/out/LUMAIRIE-EE04-ESP32S3-FLASH-IMAGES.zip \
              release/out/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "LUMAIRIE EE04 Android + ESP32-S3 Photo Transfer (Hardware Preview)" \
              --notes-file docs/RELEASE_EE04_PREVIEW.md \
              --prerelease --repo "$GITHUB_REPOSITORY"
          fi
