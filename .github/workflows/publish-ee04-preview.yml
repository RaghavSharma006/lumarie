name: Publish LUMAIRIE EE04 Android and firmware preview
on:
  push:
    branches:
      - feature/ee04-photo-transfer
    paths:
      - '.github/workflows/publish-ee04-preview.yml'
      - 'docs/RELEASE_EE04_PREVIEW.md'
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: lumairie-ee04-preview-release
  cancel-in-progress: false

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.2.0-ee04-preview.1
    steps:
      - name: Check out precise photo-transfer source commit
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore app dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Verify Flutter app and full protocol test
        working-directory: apps/mobile
        run: |
          flutter analyze --no-pub lib
          flutter test test/pairing_test.dart test/frame_wifi_transport_test.dart
      - name: Compile Android test APK (development signing only)
        working-directory: apps/mobile
        run: flutter build apk --release
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Check shared source contract
        run: python -m unittest discover -s firmware/lumairie-ee04/tests -p 'test_*.py' -v
      - name: Compile EE04 Spectra 6 integrated image
        working-directory: firmware/lumairie-ee04/device
        run: pio run -e ee04
      - name: Build release bundles and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/flash-files
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk dist/LUMAIRIE-Android-EE04-PREVIEW.apk
          cp firmware/lumairie-ee04/device/.pio/build/ee04/bootloader.bin dist/flash-files/bootloader.bin
          cp firmware/lumairie-ee04/device/.pio/build/ee04/partitions.bin dist/flash-files/partitions.bin
          cp firmware/lumairie-ee04/device/.pio/build/ee04/firmware.bin dist/flash-files/firmware.bin
          cp docs/RELEASE_EE04_PREVIEW.md dist/flash-files/READ_ME_FIRST.md
          (
            cd dist/flash-files
            sha256sum bootloader.bin partitions.bin firmware.bin > SHA256-FLASH-FILES.txt
            zip -9 -q ../LUMAIRIE-EE04-ESP32S3-FLASH-IMAGES.zip bootloader.bin partitions.bin firmware.bin READ_ME_FIRST.md SHA256-FLASH-FILES.txt
          )
          rm -rf dist/flash-files
          (
            cd dist
            sha256sum LUMAIRIE-Android-EE04-PREVIEW.apk LUMAIRIE-EE04-ESP32S3-FLASH-IMAGES.zip > SHA256SUMS.txt
          )
      - name: Create or update clearly marked GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/LUMAIRIE-Android-EE04-PREVIEW.apk dist/LUMAIRIE-EE04-ESP32S3-FLASH-IMAGES.zip dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --notes-file docs/RELEASE_EE04_PREVIEW.md --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/LUMAIRIE-Android-EE04-PREVIEW.apk dist/LUMAIRIE-EE04-ESP32S3-FLASH-IMAGES.zip dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "LUMAIRIE EE04 Android + ESP32-S3 Photo Transfer (Hardware Preview)" \
              --notes-file docs/RELEASE_EE04_PREVIEW.md \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          fi
      - name: Attach immutable CI copies
        uses: actions/upload-artifact@v4
        with:
          name: lumairie-ee04-preview-release-files
          path: |
            dist/LUMAIRIE-Android-EE04-PREVIEW.apk
            dist/LUMAIRIE-EE04-ESP32S3-FLASH-IMAGES.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
