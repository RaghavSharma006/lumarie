[platformio]
default_envs = ee04

[env:ee04]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#1.1.1
board = seeed-xiao-esp32-s3-plus
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -D BOARD_HAS_PSRAM
    -D BOARD_SCREEN_COMBO=509
    -D USE_XIAO_EPAPER_DISPLAY_BOARD_EE04
    -I src
lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git
    https://github.com/ricmoo/QRCode.git
