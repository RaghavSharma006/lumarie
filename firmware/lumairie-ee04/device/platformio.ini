[platformio]
default_envs = ee04

[env:ee04]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#1.1.1
board = seeed-xiao-esp32-s3-plus
framework = arduino
; Seeed platform 1.1.1 defaults to Arduino-ESP32 3.3.7, which has a
; reproducible XIAO ESP32-S3 NimBLE controller/TLSF startup regression.
; Pin BOTH core and IDF precompiled libraries to the matching 3.3.6 release.
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.6/esp32-core-3.3.6.tar.xz
    framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.6/esp32-core-3.3.6-libs.tar.xz
monitor_speed = 115200
upload_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -D BOARD_HAS_PSRAM
    -D BOARD_SCREEN_COMBO=509
    -D USE_XIAO_EPAPER_DISPLAY_BOARD_EE04
    -I src
lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git
    https://github.com/ricmoo/QRCode.git
