[platformio]
default_envs = ee04_spectra6

[env:ee04_spectra6]
; Seeed's official EE0x PlatformIO configuration uses the S3 Sense target
; even with the XIAO ESP32-S3 Plus carrier. Verify 16MB flash on your unit.
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-esp32-s3-sense
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
build_flags =
    -D BOARD_HAS_PSRAM
    -I src
    -D BOARD_SCREEN_COMBO=509
    -D USE_XIAO_EPAPER_DISPLAY_BOARD_EE04
lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git
    https://github.com/ricmoo/QRCode.git
