[platformio]
default_envs = ee04_spectra6

[env:ee04_spectra6]
; Exact Seeed XIAO ESP32-S3 Plus board definition (16MB flash).
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#1.1.0
board = seeed-xiao-esp32-s3-plus
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
build_flags =
    -D BOARD_HAS_PSRAM
    -I src
    -D BOARD_SCREEN_COMBO=509
    -D USE_XIAO_EPAPER_DISPLAY_BOARD_EE04
lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git
    https://github.com/ricmoo/QRCode.git
